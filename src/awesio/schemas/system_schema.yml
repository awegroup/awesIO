$schema: http://json-schema.org/draft-07/schema#
$id: system_schema
title: Airborne Wind Energy System Schema
description: >
  Complete schema for AWE system configurations with type-dependent validation.
  Validates wing, bridle, control system, tether, and ground station components.

type: object
required:
  - metadata
  - assembly
  - components

properties:
  metadata:
    type: object
    required:
      - name
      - description
      - note
      - awesIO_version
      - schema
    properties:
      name:
        type: string
      description:
        type: string
      note:
        type: string
      awesIO_version:
        type: string
      schema:
        type: string
        enum: [system_schema.yml]
    additionalProperties: false

  assembly:
    type: object
    required:
      - connectivity matrix
    properties:
      connectivity matrix:
        type: array
        items:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
    additionalProperties: false

  components:
    type: object
    required:
      - kites
      - tethers
      - ground_station
    properties:
      kites:
        type: array
        items:
          $ref: "#/definitions/kite"
      tethers:
        type: array
        items:
          $ref: "#/definitions/tether"
      ground_station:
        $ref: "#/definitions/ground_station"
    additionalProperties: false

additionalProperties: false

definitions:
  # ============================================================================
  # JOINTS
  # ============================================================================
  joints:
    type: object
    additionalProperties:
      type: object
      required:
        - id
      properties:
        id:
          type: string
      additionalProperties: false

  # ============================================================================
  # KITE - Contains wing, bridle, and control system
  # ============================================================================
  kite:
    type: object
    required:
      - name
      - type
      - version
      - joints
      - wing
    properties:
      name:
        type: string
      type:
        type: string
        enum: [soft_kite_kcu, fixed_wing_GC]
      version:
        type: [string, number]
      joints:
        $ref: "#/definitions/joints"
      wing:
        $ref: "#/definitions/wing"
      bridle:
        $ref: "#/definitions/bridle"
      control_system:
        $ref: "#/definitions/control_system"
    additionalProperties: false

  # ============================================================================
  # WING - Type-dependent validation
  # ============================================================================
  wing:
    type: object
    required:
      - name
      - type
      - version
      - structure
    properties:
      name:
        type: string
      type:
        type: string
        enum: [LEI_soft_kite, ram_air_soft_kite, fixed_wing]
      version:
        type: [string, number]
      structure:
        type: object
    allOf:
      # LEI soft kite
      - if:
          properties:
            type:
              const: LEI_soft_kite
        then:
          properties:
            structure:
              type: object
              required:
                - projected_surface_area
                - mass
              properties:
                projected_surface_area:
                  type: number
                  minimum: 0
                span:
                  type: number
                  minimum: 0
                aspect_ratio:
                  type: number
                  minimum: 0
                mass:
                  type: number
                  minimum: 0
                flattening_factor:
                  type: number
                  minimum: 0
                  maximum: 1
                wing_sections:
                  type: object
                material:
                  type: ["null", object]
              additionalProperties: true
      
      # Ram air soft kite - similar to LEI
      - if:
          properties:
            type:
              const: ram_air_soft_kite
        then:
          properties:
            structure:
              type: object
              required:
                - projected_surface_area
                - span
                - aspect_ratio
                - mass
              properties:
                projected_surface_area:
                  type: number
                  minimum: 0
                span:
                  type: number
                  minimum: 0
                aspect_ratio:
                  type: number
                  minimum: 0
                mass:
                  type: number
                  minimum: 0
                flattening_factor:
                  type: number
                  minimum: 0
                  maximum: 1
                wing_sections:
                  type: object
                material:
                  type: ["null", object]
              additionalProperties: true
      
      # Fixed wing aircraft
      - if:
          properties:
            type:
              const: fixed_wing
        then:
          properties:
            structure:
              type: object
              required:
                - projected_surface_area
                - mass
              properties:
                projected_surface_area:
                  type: number
                  minimum: 0
                wing_area:
                  type: number
                  minimum: 0
                span:
                  type: number
                  minimum: 0
                aspect_ratio:
                  type: number
                  minimum: 0
                mass:
                  type: number
                  minimum: 0
                chord:
                  type: number
                  minimum: 0
                taper_ratio:
                  type: number
                dihedral_angle:
                  type: number
                sweep_angle:
                  type: number
                wing_sections:
                  type: object
                material:
                  type: object
              additionalProperties: true
    additionalProperties: false

  # ============================================================================
  # BRIDLE - Type-dependent validation
  # ============================================================================
  bridle:
    type: object
    required:
      - name
      - type
      - version
      - structure
    properties:
      name:
        type: string
      type:
        type: string
        enum: [LEI_soft_kite_bridle]
      version:
        type: [string, number]
      structure:
        type: object
        required:
          - mass
        properties:
          mass:
            type: number
            minimum: 0
          bridle_nodes:
            type: object
          bridle_lines:
            type: object
          bridle_connections:
            type: object
          material:
            type: ["null", object]
        additionalProperties: true
    additionalProperties: false

  # ============================================================================
  # CONTROL SYSTEM - Type-dependent validation
  # ============================================================================
  control_system:
    type: object
    required:
      - name
      - type
      - version
      - structure
    properties:
      name:
        type: string
      type:
        type: string
        enum: [kite_control_unit]
      version:
        type: [string, number]
      structure:
        type: object
        required:
          - mass
        properties:
          mass:
            type: number
            minimum: 0
          frontal_area:
            type: number
            minimum: 0
        additionalProperties: true
      actuators:
        type: object
        properties:
          max_steering_line_speed:
            type: number
            minimum: 0
          max_depower_line_speed:
            type: number
            minimum: 0
          max_steering_actuator_force:
            type: number
            minimum: 0
          max_depower_actuator_force:
            type: number
            minimum: 0
        additionalProperties: true
    additionalProperties: false

  # ============================================================================
  # TETHER - Type-dependent validation
  # ============================================================================
  tether:
    type: object
    required:
      - name
      - type
      - version
      - joints
      - structure
    properties:
      name:
        type: string
      type:
        type: string
        enum: [non_conductive_tether, conductive_tether]
      version:
        type: [string, number]
      joints:
        $ref: "#/definitions/joints"
      structure:
        type: object
    allOf:
      # Non-conductive tether
      - if:
          properties:
            type:
              object: non_conductive_tether
        then:
          properties:
            structure:
              type: object
              required:
                - length
              properties:
                length:
                  type: number
                  minimum: 0
                diameter:
                  type: number
                  minimum: 0
                density:
                  type: number
                  minimum: 0
                max_tether_force:
                  type: number
                  minimum: 0
                conductive:
                  type: boolean
                material:
                  type: object
                  properties:
                    type:
                      type: string
                    youngs_modulus:
                      type: number
                    breaking_strength:
                      type: number
                    min_breaking_strength:
                      type: number
                    shear_modulus:
                      type: number
                    breaking_strain:
                      type: number
                    poisson_ratio:
                      type: number
                  additionalProperties: true
              additionalProperties: false
      
      - if:
          properties:
            type:
              object: conductive_tether
        then:
          properties:
            structure:
              type: object
              required:
                - length
              properties:
                length:
                  type: number
                  minimum: 0
                diameter:
                  type: number
                  minimum: 0
                density:
                  type: number
                  minimum: 0
                max_tether_force:
                  type: number
                  minimum: 0
                conductive:
                  type: boolean
                material:
                  type: object
                  properties:
                    type:
                      type: string
                    youngs_modulus:
                      type: number
                    breaking_strength:
                      type: number
                    min_breaking_strength:
                      type: number
                    shear_modulus:
                      type: number
                    breaking_strain:
                      type: number
                    poisson_ratio:
                      type: number
                  additionalProperties: true
              additionalProperties: false
      
  # ============================================================================
  # DRUM OBJECT
  # ============================================================================
  drum_object:
    type: object
    required:
      - type
    properties:
      name:
        type: string
      type:
        type: string
        const: electric_winch
      min_tether_speed:
        type: number
      max_tether_speed:
        type: number
        minimum: 0
      max_tether_force:
        type: number
        minimum: 0
      max_winch_acceleration:
        type: number
        minimum: 0
      drum_diameter:
        type: number
        minimum: 0
      drum_width:
        type: number
        minimum: 0
    additionalProperties: false

  # ============================================================================
  # GENERATOR OBJECT
  # ============================================================================
  generator_object:
    type: object
    required:
      - type
    properties:
      name:
        type: string
      type:
        type: string
        enum: [permanent_magnet_synchronous, induction, dc]
      rated_power:
        type: number
        minimum: 0
      max_power:
        type: number
        minimum: 0
      rated_speed:
        type: number
        minimum: 0
      efficiency:
        type: number
        minimum: 0
        maximum: 1
      voltage:
        type: number
        minimum: 0
    additionalProperties: false

  # ============================================================================
  # GEARBOX OBJECT
  # ============================================================================
  gearbox_object:
    type: object
    required:
      - type
    properties:
      name:
        type: string
      type:
        type: string
        enum: [planetary, helical, bevel]
      gear_ratio:
        type: number
        minimum: 0
      efficiency:
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: false

  # ============================================================================
  # STORAGE OBJECT
  # ============================================================================
  storage_object:
    type: object
    required:
      - type
    properties:
      name:
        type: string
      type:
        type: string
        enum: [battery_bank, flywheel, capacitor_bank]
      capacity:
        type: number
        minimum: 0
      max_charge_rate:
        type: number
        minimum: 0
      max_discharge_rate:
        type: number
        minimum: 0
      efficiency:
        type: number
        minimum: 0
        maximum: 1
      state_of_charge_initial:
        type: number
        minimum: 0
        maximum: 1
    additionalProperties: false

  # ============================================================================
  # GROUND STATION - Type-dependent validation
  # ============================================================================
  ground_station:
    type: object
    required:
      - name
      - type
      - version
      - joints
      - structure
    properties:
      name:
        type: string
      type:
        type: string
        enum: [pumping_ground_gen_station, rotary_ground_gen_station, fly_gen_station]
      version:
        type: [string, number]
      joints:
        $ref: "#/definitions/joints"
      structure:
        type: object
        required:
          - mass
        properties:
          mass:
            type: number
            minimum: 0
          height:
            type: number
            minimum: 0
        additionalProperties: false
      drums:
        type: array
      generators:
        type: array
      gearboxes:
        type: array
      storages:
        type: array
    allOf:
      # Pumping ground-gen station
      - if:
          properties:
            type:
              const: pumping_ground_gen_station
        then:
          properties:
            drums:
              type: array
              items:
                $ref: "#/definitions/drum_object"
            generators:
              type: array
              items:
                $ref: "#/definitions/generator_object"
            gearboxes:
              type: array
              items:
                $ref: "#/definitions/gearbox_object"
            storages:
              type: array
              items:
                $ref: "#/definitions/storage_object"
      
      # Rotary ground-gen station
      - if:
          properties:
            type:
              const: rotary_ground_gen_station
        then:
          properties:
            generator:
              type: object
            gearboxes:
              type: array
              items:
                $ref: "#/definitions/gearbox_object"
      
      # Fly-gen station
      - if:
          properties:
            type:
              const: fly_gen_station
        then:
          properties:
            storages:
              type: array
              items:
                $ref: "#/definitions/storage_object"
    additionalProperties: false
