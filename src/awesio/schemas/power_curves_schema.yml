$schema: http://json-schema.org/draft-07/schema#
$id: power_curves_schema
title: Power Curves Data Schema
description:
  Schema for AWES power curves data with cluster-specific power outputs.

type: object
required:
  - metadata
  - altitudes
  - reference_wind_speeds
  - power_curves

properties:
  metadata:
    type: object
    required:
      - name
      - description
      - note
      - awesIO_version
      - schema
      - time_created
      - model_config
    properties:
      name:
        type: string
      description:
        type: string
      note:
        type: string
      awesIO_version:
        type: string
      schema:
        type: string
        const: power_curves_schema.yml
      time_created:
        type: string
      model_config:
        type: object
        additionalProperties: True
      wind_resource:
        type: object
        required:
          - reference_height
        properties:
          n_clusters:
            type: integer
            minimum: 1
          reference_height:
            type: number
            minimum: 0
          location:
            type: object
            properties:
              latitude:
                type: number
              longitude:
                type: number
            additionalProperties: false
          time_range:
            type: object
            properties:
              start_date:
                type: string
              end_date:
                type: string
          data_source:
            type: string
        additionalProperties: True
    additionalProperties: True

  altitudes:
    type: array
    items:
      type: number

  reference_wind_speeds:
    type: array
    items:
      type: number

  power_curves:
    type: array
    items:
      type: object
      required:
        - profile_id
        - wind_profile
        - wind_speed_data
      properties:
        profile_id:
          type: integer
          minimum: 1
        probability_weight:
          type: number
          minimum: 0
          maximum: 1
        wind_profile:
          type: object
          required:
            - u_normalized
            - v_normalized
          properties:
            u_normalized:
              type: array
              items:
                type: number
            v_normalized:
              type: array
              items:
                type: number
          additionalProperties: True
        wind_speed_data:
          type: array
          items:
            type: object
            required:
              - wind_speed
              - performance
            properties:
              wind_speed:
                type: number
                minimum: 0
              performance:
                type: object
                properties:
                  power:
                    type: object
                    properties:
                      average_cycle_power:
                        type: number
                      average_reel_out_power:
                        type: number
                      average_reel_in_power:
                        type: number
                    additionalProperties: True
                  timing:
                    type: object
                    properties:
                      reel_out_time:
                        type: number
                        minimum: 0
                      reel_in_time:
                        type: number
                        minimum: 0
                      cycle_time:
                        type: number
                        minimum: 0
                    additionalProperties: True
                additionalProperties: True
      additionalProperties: True
  time_history:
    type: object
    required:
      - channels
      - filename
    properties:
      channels:
        type: array
        items:
          type: string
      filename:
        type: string
        description: Filename of the companion .npz file containing time-history arrays.

additionalProperties: True
