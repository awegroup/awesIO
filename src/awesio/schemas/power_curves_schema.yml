$schema: http://json-schema.org/draft-07/schema#
$id: power_curves_schema
title: Power Curves Data Schema
description: >
  Schema for AWES power curves data with cluster-specific power outputs.

type: object
required:
  - metadata
  - altitudes_m
  - reference_wind_speeds_m_s
  - power_curves

properties:
  metadata:
    type: object
    required:
      - name
      - description
      - note
      - awesIO_version
      - schema
      - time_created
      - model_config
    properties:
      name:
        type: string
      description:
        type: string
      note:
        type: string
      awesIO_version:
        type: string
      schema:
        type: string
        const: power_curves_schema.yml
      time_created:
        type: string
      model_config:
        type: object
        required:
          - wing_area_m2
          - nominal_power_w
          - nominal_tether_force_n
          - operating_altitude_m
          - tether_length_operational_m
        properties:
          wing_area_m2:
            type: number
            minimum: 0
          nominal_power_w:
            type: number
            minimum: 0
          nominal_tether_force_n:
            type: number
            minimum: 0
          cut_in_wind_speed_m_s:
            type: number
            minimum: 0
          cut_out_wind_speed_m_s:
            type: number
            minimum: 0
          operating_altitude_m:
            type: number
            minimum: 0
          tether_length_operational_m:
            type: number
            minimum: 0
        additionalProperties: True
      wind_resource:
        type: object
        required:
          - reference_height_m
        properties:
          n_clusters:
            type: integer
            minimum: 1
          reference_height_m:
            type: number
            minimum: 0
          location:
            type: object
            properties:
              latitude:
                type: number
              longitude:
                type: number
            additionalProperties: false
          time_range:
            type: object
          data_source:
            type: string
        additionalProperties: True
    additionalProperties: True

  altitudes_m:
    type: array
    items:
      type: number

  reference_wind_speeds_m_s:
    type: array
    items:
      type: number

  power_curves:
    type: array
    items:
      type: object
      required:
        - profile_id
        - probability_weight
        - wind_profile
        - wind_speed_data
      properties:
        profile_id:
          type: integer
          minimum: 1
        probability_weight:
          type: number
          minimum: 0
          maximum: 1
        wind_profile:
          type: object
          required:
            - u_normalized
            - v_normalized
          properties:
            u_normalized:
              type: array
              items:
                type: number
            v_normalized:
              type: array
              items:
                type: number
          additionalProperties: True
        wind_speed_data:
          type: array
          items:
            type: object
            required:
              - wind_speed_m_s
              - success
              - performance
            properties:
              wind_speed_m_s:
                type: number
                minimum: 0
              success:
                type: boolean
              performance:
                type: object
                properties:
                  power:
                    type: object
                    properties:
                      average_cycle_power_w:
                        type: number
                      average_reel_out_power_w:
                        type: number
                      average_reel_in_power_w:
                        type: number
                    additionalProperties: True
                  timing:
                    type: object
                    properties:
                      reel_out_time_s:
                        type: number
                        minimum: 0
                      reel_in_time_s:
                        type: number
                        minimum: 0
                      cycle_time_s:
                        type: number
                        minimum: 0
                    additionalProperties: True
                additionalProperties: True
              time_history:
                type: object
                required:
                  - time_s
                properties:
                  time_s:
                    type: array
                    items:
                      type: number
                      minimum: 0
                  altitude_m:
                    type: array
                    items:
                      type: number
                  tether_force_n:
                    type: array
                    items:
                      type: number
                  power_w:
                    type: array
                    items:
                      type: number
                  reel_speed_m_s:
                    type: array
                    items:
                      type: number
                  tether_length_m:
                    type: array
                    items:
                      type: number
                      minimum: 0
                  elevation_angle_deg:
                    type: array
                    items:
                      type: number
                additionalProperties: True
            additionalProperties: True
      additionalProperties: True
additionalProperties: True
