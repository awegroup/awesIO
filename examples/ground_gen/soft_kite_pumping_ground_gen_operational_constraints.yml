metadata:
  name: Ground-Gen Operational Constraints
  description: Operational constraints for pumping ground-gen AWE system
  note: Example operational constraints with terrain zones
  awesIO_version: 0.1.0
  schema: operational_constraints_schema.yml

airspace_constraints:
  max_altitude_agl: 500.0
  max_altitude_msl: 600.0
terrain_constraints:
  description: Minimum height restrictions by bearing and distance from the ground station
  azimuth_zones:
    - azimuth_range: [0.0, 40.0]
      flight_allowed: true
      distance_restrictions:
        - distance_range: [0, 10]
          min_height_agl: 0
        - distance_range: [10, 50]
          min_height_agl: 70
        - distance_range: [50, 200]
          min_height_agl: 100
        - distance_range: [200, 500]
          min_height_agl: 150
    - azimuth_range: [40.0, 75.0]
      flight_allowed: false
    - azimuth_range: [75.0, 360.0]
      flight_allowed: true
      distance_restrictions:
        - distance_range: [0, 10]
          min_height_agl: 0
        - distance_range: [10, 50]
          min_height_agl: 70
        - distance_range: [50, 200]
          min_height_agl: 100
        - distance_range: [200, 500]
          min_height_agl: 150